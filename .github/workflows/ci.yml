name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and run all unit + integration tests
        working-directory: java-assignment
        run: ./mvnw -B clean test

      - name: Verify JaCoCo coverage thresholds (line ≥ 80%, branch ≥ 75%)
        working-directory: java-assignment
        run: ./mvnw -B verify -DskipITs

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: java-assignment/target/site/jacoco/
          retention-days: 14
