%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=quarkus_test
%prod.quarkus.datasource.password=quarkus_test
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/quarkus_test
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.openapi.generator.spec=warehouse-openapi.yaml
quarkus.openapi.generator.base-package=com.warehouse.api

# Swagger UI — available at /q/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.info.title=Inventorix Warehouse API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Warehouse, Store and Product management API

# JWT — RSA256, 1-hour tokens
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://inventorix.com
smallrye.jwt.sign.key.location=privateKey.pem

# Flyway — auto-migrate on startup (prod/dev only; disabled in test profile)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Production: let Flyway own the schema; Hibernate just validates
%prod.quarkus.hibernate-orm.database.generation=none

# Test profile: Flyway off, Hibernate drop-and-create + import.sql
%test.quarkus.flyway.enabled=false

# Test profile: use H2 in-memory so tests run without Docker
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql